<style>
/* Shown by CloudFront for any path that isn't on the site. Colors match index.html (CC-48). */
:root, :root[data-theme="dark"] {
  --page: #0B1220; --surface: #141D2F; --text: #EAF0F8; --lead: #5CC8F5; --star: #FF5C70; --focus: #5CC8F5;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --page: #F6F6F3; --surface: #FFFFFF; --text: #111111; --lead: #D62839; --star: #D62839; --focus: #1D4ED8;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
  padding: 24px 16px; background: var(--page); color: var(--text);
  font-family: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased;
}
main {
  max-width: 34rem; text-align: center; background: var(--surface); border-block: 14px solid var(--lead);
  padding: clamp(32px, 7vw, 56px) clamp(20px, 6vw, 48px); display: grid; gap: 18px; justify-items: center;
}
.star { width: 1.6rem; height: 1.6rem; fill: var(--star); }
h1 {
  margin: 0; font-family: "Bodoni Moda", Didot, "Bodoni 72", Georgia, serif; font-style: italic; font-weight: 500;
  font-size: clamp(1.6rem, 5vw, 2.3rem); line-height: 1.15; text-wrap: balance;
}
p { margin: 0; font-size: 1.125rem; }
a { color: var(--lead); font-weight: 700; text-underline-offset: 3px; }
a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
</style>

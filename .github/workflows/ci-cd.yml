# Checks every pull request; on main, also publishes the page to S3 and refreshes CloudFront.
# AWS access is through OIDC (no stored keys): the deploy job runs in the "production"
# environment, which only main may use, and assumes the role in vars.AWS_DEPLOY_ROLE_ARN.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Page checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pages parse, and every element the scripts use exists
        run: python3 scripts/check_pages.py
      - name: Every colour pair meets WCAG AA in both themes
        run: python3 scripts/check_contrast.py
      - name: Each event always gets the same water pattern
        run: node scripts/test_water.js
      - name: Listings sit under the right day heads, one link per row
        run: node scripts/test_listings.js
      - name: The event page is a poster, with its plan buttons and crews
        run: node scripts/test_event.js
      - name: The home front page picks its lead and lists last chances
        run: node scripts/test_home.js
      - name: The motion keeps the brief's timings, 30fps drift and reduced-motion fallbacks
        run: node scripts/test_motion.js
      - name: The crews page keeps every crew action, with plans as event rows
        run: node scripts/test_crews.js
      - name: My week keeps its plans, Find something and the journal, with plans as event rows
        run: node scripts/test_week.js
      - name: Invite a friend, its QR screen and the invite page keep their labels, focus and counts
        run: node scripts/test_invite.js
      - name: Asset links can be stamped for deploy
        run: python3 scripts/stamp_assets.py
      - name: JavaScript syntax
        run: |
          for f in build/scripts/*.js; do node --check "$f" && echo "ok: $f"; done

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://chiculturecrew.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # lets the job ask GitHub for an OIDC token to trade for AWS credentials
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Stamp the asset links
        run: python3 scripts/stamp_assets.py

      - name: Upload the pages
        env:
          BUCKET: ${{ vars.SITE_BUCKET }}
        run: |
          cd build/site
          # css/ and js/ first, so a page never links files that aren't there yet. Their links carry a
          # content hash (stamp_assets.py), so browsers may keep them for a year (CC-65).
          aws s3 cp css "s3://$BUCKET/css/" --recursive --cache-control "public, max-age=31536000, immutable" --content-type "text/css; charset=utf-8"
          aws s3 cp js "s3://$BUCKET/js/" --recursive --cache-control "public, max-age=31536000, immutable" --content-type "text/javascript; charset=utf-8"
          # images (the link preview): a day in browsers; the invalidation below refreshes CloudFront
          aws s3 cp img "s3://$BUCKET/img/" --recursive --cache-control max-age=86400
          # index.html is revalidated on every visit; the 404 page can be cached briefly
          aws s3 cp index.html "s3://$BUCKET/index.html" --cache-control no-cache --content-type "text/html; charset=utf-8"
          # CC-121: chiculturecrew.com/join is the same page with the join page's preview tags (stamp_assets.py)
          aws s3 cp join "s3://$BUCKET/join" --cache-control no-cache --content-type "text/html; charset=utf-8"
          # CC-126: chiculturecrew.com/invite, the same page with the invite page's preview tags
          aws s3 cp invite "s3://$BUCKET/invite" --cache-control no-cache --content-type "text/html; charset=utf-8"
          aws s3 cp 404.html "s3://$BUCKET/404.html" --cache-control max-age=300 --content-type "text/html; charset=utf-8"
          # CC-150: then remove what the site no longer has (a file deleted from public/). The uploads above made
          # every size match, so --size-only copies nothing here; it only deletes keys that aren't in build/site.
          # css/ and js/ keep their names (the hash is a ?v= query), so nothing a cached page links goes away.
          aws s3 sync . "s3://$BUCKET/" --delete --size-only

      - name: Refresh CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths '/*' --query 'Invalidation.[Id,Status]' --output text

      - name: Check the live site
        run: |
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null https://chiculturecrew.com/ && curl -fsS https://chiculturecrew.com/ | grep -q '<title>Culture Crew' &&
               curl -fsS https://chiculturecrew.com/join | grep -q 'og:url" content="https://chiculturecrew.com/join"' &&
               curl -fsS https://chiculturecrew.com/invite | grep -q 'og:url" content="https://chiculturecrew.com/invite"'; then
              echo "chiculturecrew.com, /join and /invite are up"; exit 0
            fi
            sleep 3
          done
          echo "chiculturecrew.com isn't serving the page" >&2
          exit 1

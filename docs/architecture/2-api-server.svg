<rect class="box" x="495.2" y="274" width="100.8" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545.6" y="292" text-anchor="middle" dominant-baseline="central">/admin</text><text class="ts" x="545.6" y="312" text-anchor="middle" dominant-baseline="central">Review, members</text><rect class="box" x="60" y="372" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="148" y="390" text-anchor="middle" dominant-baseline="central">Mail credentials</text><text class="ts" x="148" y="410" text-anchor="middle" dominant-baseline="central">Refreshed every 30 min</text><rect class="box" x="252" y="372" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="390" text-anchor="middle" dominant-baseline="central">Event discovery</text><text class="ts" x="340" y="410" text-anchor="middle" dominant-baseline="central">Hourly, 7 AM to 10 PM</text><rect class="box" x="444" y="372" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="532" y="390" text-anchor="middle" dominant-baseline="central">Weekly recap</text><text class="ts" x="532" y="410" text-anchor="middle" dominant-baseline="central">Tuesdays, 10 AM</text><path d="M244 352 L244 488" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="428" x2="340" y2="488" class="arr" marker-end="url(#arrow)"/><line x1="532" y1="428" x2="532" y2="488" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="40" y="492" width="600" height="232" rx="20" stroke-width="0.5"/><text class="th" x="60" y="514" dominant-baseline="central">PostgreSQL · Amazon RDS</text></g>
<rect class="box" x="76" y="532" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="124" y="554" text-anchor="middle" dominant-baseline="central">users</text>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img"><title>Inside the Culture Crew API server</title><desc>On the EC2 server, Caddy receives every request and passes it to the api container, which runs FastAPI with six route groups: auth, events, me, venues, traffic and admin (review, stats and event discovery). A mail credentials job runs on the server every 30 minutes; EventBridge Scheduler starts the event discovery job every hour and the weekly recap email on Tuesdays, both in the api container. The api container reads and writes the PostgreSQL database on RDS: users, events, venues, attended and plans, the event discovery tables, and the traffic counts and settings.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:#3d3d3a}.th{font-weight:600}.ts{font-size:12px;fill:#73726c}rect.box{fill:#ffffff;stroke:#888780}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple>.th{fill:#3C3489} .c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal>.th{fill:#085041} .c-teal>.ts{fill:#0F6E56}.c-pink>rect,rect.c-pink{fill:#FBEAF0;stroke:#993556} .c-pink>.th{fill:#72243E} .c-pink>.ts{fill:#993556}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray>.th{fill:#444441} .c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}rect.box{fill:#2c2c2a;stroke:#888780}.arr{stroke:#b4b2a9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC} .c-purple>.th{fill:#CECBF6} .c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5} .c-teal>.th{fill:#9FE1CB} .c-teal>.ts{fill:#5DCAA5}.c-pink>rect,rect.c-pink{fill:#72243E;stroke:#ED93B1} .c-pink>.th{fill:#F4C0D1} .c-pink>.ts{fill:#ED93B1}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9} .c-gray>.th{fill:#D3D1C7} .c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="60" width="600" height="326" rx="20" stroke-width="0.5"/><text class="th" x="60" y="84" dominant-baseline="central">API server · EC2, us-east-2</text></g>
<text class="ts" x="352" y="40" dominant-baseline="central">Requests from browsers</text>
<line x1="340" y1="30" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="60" y="100" width="560" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central">Caddy · HTTPS, the only way in</text>
<line x1="340" y1="144" x2="340" y2="166" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="60" y="170" width="560" height="120" rx="12" stroke-width="0.5"/><text class="th" x="340" y="192" text-anchor="middle" dominant-baseline="central">api container · FastAPI</text></g>
<rect class="box" x="76" y="212" width="70" height="56" rx="8" stroke-width="0.5"/><text class="th" x="111" y="230" text-anchor="middle" dominant-baseline="central">/auth</text><text class="ts" x="111" y="250" text-anchor="middle" dominant-baseline="central">Accounts</text><rect class="box" x="152.4" y="212" width="70" height="56" rx="8" stroke-width="0.5"/><text class="th" x="187.4" y="230" text-anchor="middle" dominant-baseline="central">/events</text><text class="ts" x="187.4" y="250" text-anchor="middle" dominant-baseline="central">Catalog</text><rect class="box" x="228.8" y="212" width="70" height="56" rx="8" stroke-width="0.5"/><text class="th" x="263.8" y="230" text-anchor="middle" dominant-baseline="central">/me</text><text class="ts" x="263.8" y="250" text-anchor="middle" dominant-baseline="central">Your plans</text><rect class="box" x="305.2" y="212" width="78" height="56" rx="8" stroke-width="0.5"/><text class="th" x="344.2" y="230" text-anchor="middle" dominant-baseline="central">/venues</text><text class="ts" x="344.2" y="250" text-anchor="middle" dominant-baseline="central">Venues</text><rect class="box" x="389.6" y="212" width="78" height="56" rx="8" stroke-width="0.5"/><text class="th" x="428.6" y="230" text-anchor="middle" dominant-baseline="central">/traffic</text><text class="ts" x="428.6" y="250" text-anchor="middle" dominant-baseline="central">Visits</text><rect class="box" x="474" y="212" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="539" y="230" text-anchor="middle" dominant-baseline="central">/admin</text><text class="ts" x="539" y="250" text-anchor="middle" dominant-baseline="central">Review, discovery</text><rect class="box" x="60" y="310" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="148" y="328" text-anchor="middle" dominant-baseline="central">Mail credentials</text><text class="ts" x="148" y="348" text-anchor="middle" dominant-baseline="central">Refreshed every 30 min</text><rect class="box" x="252" y="310" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="328" text-anchor="middle" dominant-baseline="central">Event discovery</text><text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">Hourly, 7 AM to 10 PM</text><rect class="box" x="444" y="310" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="532" y="328" text-anchor="middle" dominant-baseline="central">Weekly recap</text><text class="ts" x="532" y="348" text-anchor="middle" dominant-baseline="central">Tuesdays, 10 AM</text><path d="M244 290 L244 426" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="366" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/><line x1="532" y1="366" x2="532" y2="426" class="arr" marker-end="url(#arrow)"/><g class="c-teal"><rect x="40" y="430" width="600" height="168" rx="20" stroke-width="0.5"/><text class="th" x="60" y="452" dominant-baseline="central">PostgreSQL · Amazon RDS</text></g>
<rect class="box" x="76" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="124" y="492" text-anchor="middle" dominant-baseline="central">users</text>
<rect class="box" x="184" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="232" y="492" text-anchor="middle" dominant-baseline="central">events</text>
<rect class="box" x="292" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central">venues</text>
<rect class="box" x="400" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="448" y="492" text-anchor="middle" dominant-baseline="central">attended</text>
<rect class="box" x="508" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="556" y="492" text-anchor="middle" dominant-baseline="central">plans</text>
<rect class="box" x="76" y="526" width="344" height="56" rx="8" stroke-width="0.5"/><text class="th" x="248" y="544" text-anchor="middle" dominant-baseline="central">Event discovery tables</text><text class="ts" x="248" y="564" text-anchor="middle" dominant-baseline="central">Sources, found items, checks, skip rules</text><rect class="box" x="428" y="526" width="176" height="56" rx="8" stroke-width="0.5"/><text class="th" x="516" y="544" text-anchor="middle" dominant-baseline="central">Counts, settings</text><text class="ts" x="516" y="564" text-anchor="middle" dominant-baseline="central">Traffic, activity, budget</text></svg>

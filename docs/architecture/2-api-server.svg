<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img"><title>Inside the Culture Crew API server</title><desc>On the EC2 server, Caddy receives every request and passes it to the api container, which runs FastAPI with five route groups: auth, events, me, admin and venues. A mail credentials job and the nightly sheet sync job also run on the server. The api container and the sync job read and write the PostgreSQL database on RDS, which holds the users, events, venues, attended and plans tables.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:#3d3d3a}.th{font-weight:600}.ts{font-size:12px;fill:#73726c}rect.box{fill:#ffffff;stroke:#888780}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple>.th{fill:#3C3489} .c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal>.th{fill:#085041} .c-teal>.ts{fill:#0F6E56}.c-pink>rect,rect.c-pink{fill:#FBEAF0;stroke:#993556} .c-pink>.th{fill:#72243E} .c-pink>.ts{fill:#993556}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray>.th{fill:#444441} .c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}rect.box{fill:#2c2c2a;stroke:#888780}.arr{stroke:#b4b2a9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC} .c-purple>.th{fill:#CECBF6} .c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5} .c-teal>.th{fill:#9FE1CB} .c-teal>.ts{fill:#5DCAA5}.c-pink>rect,rect.c-pink{fill:#72243E;stroke:#ED93B1} .c-pink>.th{fill:#F4C0D1} .c-pink>.ts{fill:#ED93B1}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9} .c-gray>.th{fill:#D3D1C7} .c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="40" y="60" width="600" height="326" rx="20" stroke-width="0.5"/><text class="th" x="60" y="84" dominant-baseline="central">API server · EC2, us-east-2</text></g>
<text class="ts" x="352" y="40" dominant-baseline="central">Requests from browsers</text>
<line x1="340" y1="30" x2="340" y2="96" class="arr" marker-end="url(#arrow)"/>
<rect class="box" x="60" y="100" width="560" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central">Caddy · HTTPS, the only way in</text>
<line x1="340" y1="144" x2="340" y2="166" class="arr" marker-end="url(#arrow)"/>
<g class="c-pink"><rect x="60" y="170" width="560" height="120" rx="12" stroke-width="0.5"/><text class="th" x="340" y="192" text-anchor="middle" dominant-baseline="central">api container · FastAPI</text></g>
<rect class="box" x="76" y="212" width="96" height="56" rx="8" stroke-width="0.5"/><text class="th" x="124" y="230" text-anchor="middle" dominant-baseline="central">/auth</text><text class="ts" x="124" y="250" text-anchor="middle" dominant-baseline="central">Accounts</text>
<rect class="box" x="184" y="212" width="96" height="56" rx="8" stroke-width="0.5"/><text class="th" x="232" y="230" text-anchor="middle" dominant-baseline="central">/events</text><text class="ts" x="232" y="250" text-anchor="middle" dominant-baseline="central">Catalog</text>
<rect class="box" x="292" y="212" width="96" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="230" text-anchor="middle" dominant-baseline="central">/me</text><text class="ts" x="340" y="250" text-anchor="middle" dominant-baseline="central">Your plans</text>
<rect class="box" x="400" y="212" width="96" height="56" rx="8" stroke-width="0.5"/><text class="th" x="448" y="230" text-anchor="middle" dominant-baseline="central">/admin</text><text class="ts" x="448" y="250" text-anchor="middle" dominant-baseline="central">Review</text>
<rect class="box" x="508" y="212" width="96" height="56" rx="8" stroke-width="0.5"/><text class="th" x="556" y="230" text-anchor="middle" dominant-baseline="central">/venues</text><text class="ts" x="556" y="250" text-anchor="middle" dominant-baseline="central">Venue tools</text>
<rect class="box" x="60" y="310" width="264" height="56" rx="8" stroke-width="0.5"/><text class="th" x="192" y="328" text-anchor="middle" dominant-baseline="central">Mail credentials</text><text class="ts" x="192" y="348" text-anchor="middle" dominant-baseline="central">Refreshed every 30 min</text>
<rect class="box" x="356" y="310" width="264" height="56" rx="8" stroke-width="0.5"/><text class="th" x="488" y="328" text-anchor="middle" dominant-baseline="central">Sheet sync job</text><text class="ts" x="488" y="348" text-anchor="middle" dominant-baseline="central">Started nightly via SSM</text>
<line x1="340" y1="290" x2="340" y2="426" class="arr" marker-end="url(#arrow)"/>
<line x1="560" y1="366" x2="560" y2="426" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="40" y="430" width="600" height="110" rx="20" stroke-width="0.5"/><text class="th" x="60" y="452" dominant-baseline="central">PostgreSQL · Amazon RDS</text></g>
<rect class="box" x="76" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="124" y="492" text-anchor="middle" dominant-baseline="central">users</text>
<rect class="box" x="184" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="232" y="492" text-anchor="middle" dominant-baseline="central">events</text>
<rect class="box" x="292" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="492" text-anchor="middle" dominant-baseline="central">venues</text>
<rect class="box" x="400" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="448" y="492" text-anchor="middle" dominant-baseline="central">attended</text>
<rect class="box" x="508" y="470" width="96" height="44" rx="8" stroke-width="0.5"/><text class="th" x="556" y="492" text-anchor="middle" dominant-baseline="central">plans</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img"><title>Culture Crew system overview</title><desc>The visitor's browser loads the site from CloudFront and S3, and calls the API server on EC2. The API reads and writes PostgreSQL on RDS, sends emails through Amazon SES, and checks the venues' own websites for new events (event discovery), with Claude Haiku on the Anthropic API reading changed pages. EventBridge Scheduler starts the hourly discovery and the Tuesday recap email.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:#3d3d3a}.th{font-weight:600}.ts{font-size:12px;fill:#73726c}rect.box{fill:#ffffff;stroke:#888780}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple>.th{fill:#3C3489} .c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal>.th{fill:#085041} .c-teal>.ts{fill:#0F6E56}.c-pink>rect,rect.c-pink{fill:#FBEAF0;stroke:#993556} .c-pink>.th{fill:#72243E} .c-pink>.ts{fill:#993556}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray>.th{fill:#444441} .c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}rect.box{fill:#2c2c2a;stroke:#888780}.arr{stroke:#b4b2a9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC} .c-purple>.th{fill:#CECBF6} .c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5} .c-teal>.th{fill:#9FE1CB} .c-teal>.ts{fill:#5DCAA5}.c-pink>rect,rect.c-pink{fill:#72243E;stroke:#ED93B1} .c-pink>.th{fill:#F4C0D1} .c-pink>.ts{fill:#ED93B1}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9} .c-gray>.th{fill:#D3D1C7} .c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="40" y="120" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="110" y="138" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="110" y="158" text-anchor="middle" dominant-baseline="central">Runs the page JS</text></g>
<g class="c-purple"><rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Site · CloudFront + S3</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">HTML, CSS, JS, images</text></g>
<g class="c-purple"><rect x="240" y="200" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="218" text-anchor="middle" dominant-baseline="central">API server · EC2</text><text class="ts" x="340" y="238" text-anchor="middle" dominant-baseline="central">Caddy, then FastAPI</text></g>
<g class="c-gray"><rect x="490" y="120" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="138" text-anchor="middle" dominant-baseline="central">Venue websites</text><text class="ts" x="565" y="158" text-anchor="middle" dominant-baseline="central">Checked hourly</text></g>
<g class="c-teal"><rect x="490" y="200" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="218" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="565" y="238" text-anchor="middle" dominant-baseline="central">Amazon RDS</text></g>
<g class="c-teal"><rect x="490" y="300" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="318" text-anchor="middle" dominant-baseline="central">Amazon SES</text><text class="ts" x="565" y="338" text-anchor="middle" dominant-baseline="central">Account emails, recap</text></g>
<g class="c-gray"><rect x="490" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="565" y="58" text-anchor="middle" dominant-baseline="central">Claude Haiku</text><text class="ts" x="565" y="78" text-anchor="middle" dominant-baseline="central">Anthropic API</text></g><g class="c-teal"><rect x="240" y="320" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="338" text-anchor="middle" dominant-baseline="central">EventBridge Scheduler</text><text class="ts" x="340" y="358" text-anchor="middle" dominant-baseline="central">Discovery, Tuesday recap</text></g><path d="M440 206 L456 206 L456 68 L486 68" class="arr" marker-end="url(#arrow)"/><line x1="340" y1="320" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/><path d="M180 140 L210 140 L210 68 L236 68" class="arr" marker-end="url(#arrow)"/>
<path d="M180 156 L210 156 L210 228 L236 228" class="arr" marker-end="url(#arrow)"/>

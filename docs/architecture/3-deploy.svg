<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680" role="img"><title>How a change ships</title><desc>A pull request runs checks: tests on SQLite and Postgres, Terraform validation and page checks. Merging to main deploys. For the site, GitHub Actions uploads to S3, refreshes CloudFront and checks the live site. For the API, it builds an image, pushes it to ECR, deploys through SSM Run Command, which pulls, migrates and restarts, then checks the live API. Terraform changes are applied separately by the owner.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.t,.th{font-size:14px;fill:#3d3d3a}.th{font-weight:600}.ts{font-size:12px;fill:#73726c}rect.box{fill:#ffffff;stroke:#888780}.arr{stroke:#73726c;stroke-width:1.5;fill:none}.c-purple>rect,rect.c-purple{fill:#EEEDFE;stroke:#534AB7} .c-purple>.th{fill:#3C3489} .c-purple>.ts{fill:#534AB7}.c-teal>rect,rect.c-teal{fill:#E1F5EE;stroke:#0F6E56} .c-teal>.th{fill:#085041} .c-teal>.ts{fill:#0F6E56}.c-pink>rect,rect.c-pink{fill:#FBEAF0;stroke:#993556} .c-pink>.th{fill:#72243E} .c-pink>.ts{fill:#993556}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A} .c-gray>.th{fill:#444441} .c-gray>.ts{fill:#5F5E5A}@media (prefers-color-scheme:dark){.t,.th{fill:#e8e6dc}.ts{fill:#b4b2a9}rect.box{fill:#2c2c2a;stroke:#888780}.arr{stroke:#b4b2a9}.c-purple>rect,rect.c-purple{fill:#3C3489;stroke:#AFA9EC} .c-purple>.th{fill:#CECBF6} .c-purple>.ts{fill:#AFA9EC}.c-teal>rect,rect.c-teal{fill:#085041;stroke:#5DCAA5} .c-teal>.th{fill:#9FE1CB} .c-teal>.ts{fill:#5DCAA5}.c-pink>rect,rect.c-pink{fill:#72243E;stroke:#ED93B1} .c-pink>.th{fill:#F4C0D1} .c-pink>.ts{fill:#ED93B1}.c-gray>rect,rect.c-gray{fill:#444441;stroke:#B4B2A9} .c-gray>.th{fill:#D3D1C7} .c-gray>.ts{fill:#B4B2A9}}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-gray"><rect x="240" y="40" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Pull request</text><text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">Branch named for Jira</text></g>
<line x1="340" y1="96" x2="340" y2="126" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="200" y="130" width="280" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="148" text-anchor="middle" dominant-baseline="central">Checks on every PR</text><text class="ts" x="340" y="168" text-anchor="middle" dominant-baseline="central">Tests, Terraform, page checks</text></g>
<line x1="340" y1="186" x2="340" y2="216" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><rect x="240" y="220" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="238" text-anchor="middle" dominant-baseline="central">Merge to main</text><text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">AWS access via OIDC</text></g>
<path d="M340 276 L340 296 L180 296 L180 316" class="arr" marker-end="url(#arrow)"/>
<path d="M340 296 L500 296 L500 316" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="320" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="338" text-anchor="middle" dominant-baseline="central">Upload to S3</text><text class="ts" x="180" y="358" text-anchor="middle" dominant-baseline="central">index.html, 404, img/</text></g>
<line x1="180" y1="376" x2="180" y2="396" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="400" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="418" text-anchor="middle" dominant-baseline="central">Refresh CloudFront</text><text class="ts" x="180" y="438" text-anchor="middle" dominant-baseline="central">Clear the cached copy</text></g>
<line x1="180" y1="456" x2="180" y2="476" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="60" y="480" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="180" y="498" text-anchor="middle" dominant-baseline="central">Check the live site</text><text class="ts" x="180" y="518" text-anchor="middle" dominant-baseline="central">Page answers with title</text></g>
<g class="c-teal"><rect x="380" y="320" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="338" text-anchor="middle" dominant-baseline="central">Build the API image</text><text class="ts" x="500" y="358" text-anchor="middle" dominant-baseline="central">Pushed to ECR</text></g>
<line x1="500" y1="376" x2="500" y2="396" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="380" y="400" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="418" text-anchor="middle" dominant-baseline="central">Deploy via SSM</text><text class="ts" x="500" y="438" text-anchor="middle" dominant-baseline="central">Pull, migrate, restart</text></g>
<line x1="500" y1="456" x2="500" y2="476" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal"><rect x="380" y="480" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="498" text-anchor="middle" dominant-baseline="central">Check the live API</text><text class="ts" x="500" y="518" text-anchor="middle" dominant-baseline="central">/health answers ok</text></g>
<g class="c-gray"><rect x="160" y="570" width="360" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/><text class="th" x="340" y="588" text-anchor="middle" dominant-baseline="central">Terraform: separate, by the owner</text><text class="ts" x="340" y="608" text-anchor="middle" dominant-baseline="central">AWS resources change only on apply</text></g>
<rect x="60" y="648" width="12" height="12" rx="2" class="c-purple" stroke-width="0.5"/><text class="ts" x="78" y="654" dominant-baseline="central">cc-site repo</text>
<rect x="190" y="648" width="12" height="12" rx="2" class="c-teal" stroke-width="0.5"/><text class="ts" x="208" y="654" dominant-baseline="central">cc-backend repo</text>
</svg>
